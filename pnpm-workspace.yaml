minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - .

overrides:
  # cssnano 9 dropped the staged-publish evidence required by trustPolicy.
  # Keep Nuxt 4.6.1 while retaining the previously trusted CSS minifier.
  '@nuxt/vite-builder@4.6.1>cssnano': 8.0.10
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

catalog: {}

catalogs:
  dev:
    '@cloudflare/workers-types': ^5.20261012.1
    '@types/node': 26.6.2
    '@unocss/nuxt': ^66.7.5
    '@unocss/preset-attributify': ^66.7.5
    '@unocss/preset-tagify': ^66.7.5
    '@unocss/preset-typography': ^66.7.5
    '@unocss/preset-wind4': ^66.7.5
    '@unocss/transformer-directives': ^66.7.5
    '@unocss/transformer-variant-group': ^66.7.5
    cf: 1.0.0-beta.12
    happy-dom: ^20.0.0
    lint-staged: ^16.1.6
    simple-git-hooks: ^2.14.0
    typescript: ~5.9.3
    unocss: ^66.7.5
    vitest: 5.0.5
    vite-plus: 1.3.0
    vue-tsc: ^3.3.11
    wrangler: ^4.136.0
  prod:
    '@fontsource-variable/eb-garamond': ^5.2.6
    '@fontsource-variable/geist': ^5.3.0
    '@fontsource-variable/geist-mono': ^5.3.0
    '@fontsource-variable/instrument-sans': ^5.3.0
    '@fontsource/instrument-serif': ^5.3.0
    '@vueuse/core': ^14.4.0
    '@vueuse/nuxt': ^14.4.0
    h3: ^1.15.11
    isomorphic-dompurify: ^3.22.0
    modern-screenshot: ^4.7.0
    nuxt: ^4.6.1
    vue: ^3.5.43
    zod: ^4.6.6

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
  - unrs-resolver
  - workerd
