shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  # First publish of the Oxlint flat-config toolkit; required by @liangmi/vp-config.
  - '@oxlint-flat-config/composer@0.3.1'
  - oxlint-flat-config@0.4.0
  - '@liangmi/vp-config@1.0.0'

packages:
  - .

overrides:
  # Keep the Vue version already locked on main.
  vue: 3.5.41
  # Keep the nitropack version already locked on main.
  nitropack: 2.13.4

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true

catalogs:
  dev:
    '@cloudflare/workers-types': 5.20261012.1
    '@liangmi/vp-config': 1.0.0
    '@types/node': 26.2.0
    '@unocss/nuxt': 66.7.5
    '@unocss/preset-attributify': 66.7.5
    '@unocss/preset-tagify': 66.7.5
    '@unocss/preset-typography': 66.7.5
    '@unocss/preset-wind4': 66.7.5
    '@unocss/transformer-directives': 66.7.5
    '@unocss/transformer-variant-group': 66.7.5
    cf: 1.0.0-beta.12
    happy-dom: 20.11.2
    lint-staged: 16.4.0
    simple-git-hooks: 2.13.1
    typescript: 5.9.3
    unocss: 66.7.5
    vite-plus: 1.3.0
    vitest: 4.1.10
    vue-tsc: 3.3.10
    wrangler: 4.149.0
  prod:
    '@fontsource-variable/eb-garamond': 5.3.0
    '@fontsource-variable/geist': 5.3.0
    '@fontsource-variable/geist-mono': 5.3.0
    '@fontsource-variable/instrument-sans': 5.3.0
    '@fontsource/instrument-serif': 5.3.0
    '@vueuse/core': 14.4.0
    '@vueuse/nuxt': 14.4.0
    h3: 1.15.11
    isomorphic-dompurify: 3.22.0
    modern-screenshot: 4.7.0
    nuxt: 4.5.2
    vue: 3.5.41
    zod: 4.4.3
