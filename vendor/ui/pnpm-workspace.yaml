minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - .
  - docs

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - workerd

catalogs:
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@nuxt/eslint': ^1.17.0
    '@types/node': ^22.0.0
    cf: 1.0.0-beta.12
    eslint: ^10.9.1
    eslint-plugin-format: ^2.0.1
    jiti: ^2.7.0
    typescript: ~5.9.3
    vue-tsc: ^3.3.11
    wrangler: ^4.136.0
  prod:
    '@fontsource-variable/geist': ^5.3.0
    '@fontsource-variable/geist-mono': ^5.3.0
    '@fontsource/instrument-serif': ^5.3.0
    '@nuxt/content': ^3.16.1
    '@nuxtjs/i18n': ^10.6.0
    nuxt: ^4.5.2
    vue: ^3.5.43
